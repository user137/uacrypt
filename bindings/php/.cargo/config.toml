# `rust-lld` instead of the default MSVC `link.exe` - ext-php-rs's own README ("Windows
# Requirements") recommends this specifically: `link.exe`'s version may not be compatible with
# whatever linker built the target PHP installation, and using `rust-lld` avoids that mismatch
# entirely rather than needing to pin a matching MSVC toolset version.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

# macOS's Mach-O linker resolves every symbol at link time by default (unlike Linux's ELF .so,
# which tolerates undefined symbols left for `dlopen` to resolve at runtime - why this only failed
# on macOS-latest CI, not ubuntu-latest, both building the same crate). `dstu_core_php` calls Zend
# API functions (`zend_ce_value_error`, `zend_throw_error`, ...) that only exist inside the `php`
# executable that will eventually `dlopen` this cdylib, not in any library available at link time -
# a standard gotcha for any Rust cdylib meant to be loaded as a plugin into a host process on macOS
# (same fix Python/Ruby/Node native extensions all need on this platform). `-undefined
# dynamic_lookup` defers those lookups to load time instead of failing the link. Found via a real
# CI failure (`cargo build` on macos-latest, undefined symbol linker errors), not predicted in
# advance - this dev machine is Windows-only, so this path was never locally buildable at all.
[target.x86_64-apple-darwin]
rustflags = ["-C", "link-args=-Wl,-undefined,dynamic_lookup"]
[target.aarch64-apple-darwin]
rustflags = ["-C", "link-args=-Wl,-undefined,dynamic_lookup"]
