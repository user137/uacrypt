[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "dstu-core"
version = "0.1.0"
description = "Python bindings for dstu-core (Ukrainian DSTU cryptographic standards) - provisional, not yet published"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Development Status :: 3 - Alpha",
]

[project.urls]
Repository = "https://github.com/user137/uacrypt"

[project.optional-dependencies]
# Pinned so CI and any local `.venv` build the same toolchain instead of drifting - `docs/
# bindings-strategy.md` T-49 step 5's own note (advisor review, 2026-08-02).
dev = ["maturin==1.14.1", "pytest==9.1.1", "ruff==0.16.1"]

[tool.maturin]
module-name = "dstu_core._dstu_core"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
