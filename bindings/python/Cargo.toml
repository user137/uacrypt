# Deliberately its own workspace, not a member of the repo-root `[workspace]` - see
# `docs/DECISIONS.md` D-119. Two root-workspace CI jobs use `--workspace` explicitly (Miri, the
# MSRV-pinned build); neither is equipped for a PyO3 `cdylib`, and a path dependency on `dstu-core`
# below still resolves correctly across separate workspaces without one.
[workspace]

[package]
name = "dstu_core_py"
version = "0.1.0"
edition = "2021"
rust-version = "1.87.0"
license = "MIT OR Apache-2.0"
description = "Python bindings for dstu-core (Ukrainian DSTU cryptographic standards) - provisional, not yet published to PyPI"
publish = false

[lib]
name = "_dstu_core"
crate-type = ["cdylib"]

[dependencies]
dstu-core = { path = "../../crates/dstu-core", features = ["std", "selftest"] }
# `extension-module` is unconditional here, not gated behind a `maturin`-only feature the way the
# standard pyo3 template does it (`optional = true`, maturin turns it on) - fine for `cargo build`/
# `maturin develop`, both verified working, but this is known to break a plain `cargo test` in this
# crate on Linux (an extension-module cdylib can't link a test harness the normal way). Revisit if
# step 6 (this binding's own Rust-side tests, if any beyond `pytest`) hits this - not restructured
# now since nothing here needs `cargo test` yet.
pyo3 = { version = "0.29", features = ["extension-module"] }
