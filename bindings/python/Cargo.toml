# Deliberately its own workspace, not a member of the repo-root `[workspace]` - see
# `docs/DECISIONS.md` D-119. Two root-workspace CI jobs use `--workspace` explicitly (Miri, the
# MSRV-pinned build); neither is equipped for a PyO3 `cdylib`, and a path dependency on `dstu-core`
# below still resolves correctly across separate workspaces without one.
[workspace]

[package]
name = "dstu_core_py"
version = "0.1.0"
edition = "2021"
rust-version = "1.87.0"
license = "MIT OR Apache-2.0"
description = "Python bindings for dstu-core (Ukrainian DSTU cryptographic standards) - provisional, not yet published to PyPI"
publish = false

[lib]
name = "_dstu_core"
crate-type = ["cdylib"]

[dependencies]
dstu-core = { path = "../../crates/dstu-core", version = "0.3.0", features = ["std", "selftest", "pwhash"] }
# `extension-module` is deliberately NOT set here (unlike the standard pyo3 template's own
# unconditional-feature shape, which this crate used until step 4) - `pyproject.toml`'s
# `[tool.maturin] features = ["pyo3/extension-module"]` already turns it on for every real
# `maturin build`/`develop` invocation, and an extension-module cdylib cannot link a `cargo test`
# harness on Linux (T-49 step 4, `docs/bindings-strategy.md`), a real CI-job failure this avoids
# pre-emptively rather than debugging from a CI log.
#
# `abi3-py39` (stable ABI, floor matching `pyproject.toml`'s `requires-python = ">=3.9"`): one
# wheel per platform instead of one per (platform, CPython minor version) - this crate's surface
# (plain functions, a few `#[pyclass]`es with getters, one `create_exception!`) is abi3-clean,
# verified by a full build + the existing Python smoke suite passing unchanged under this feature.
pyo3 = { version = "0.29", features = ["abi3-py39"] }
