# SonarQube Cloud configuration for Rust analysis (TASKS.md T-140, DECISIONS.md D-92).
#
# sonar.projectKey/sonar.organization are placeholders - fill in the real values shown on the
# project's own "Administration > General Settings" page once it's created via sonarcloud.io's
# GitHub OAuth sign-in (that step needs the repo owner, not something this file can supply).
# SonarCloud's own project-creation wizard also generates a ready-to-use version of this file and
# the accompanying GitHub Actions workflow tuned to what it actually detects in the repo - treat
# this checked-in version as a documented starting point to reconcile against that wizard output,
# not as the final word if the two disagree.
sonar.projectKey=CHANGE_ME_projectKey
sonar.organization=CHANGE_ME_organization

sonar.sources=crates/dstu-core/src,crates/uacrypt/src
sonar.tests=crates/dstu-core/tests,crates/dstu-core/benches,crates/uacrypt/tests

# Excludes build output and vendored/gitignored oracle clones - none of this is our own code.
sonar.exclusions=target/**,oracles/**

# Rust analysis prerequisites (rustup + `rustup component add clippy`) are installed in the CI
# workflow (.github/workflows/sonarcloud.yml), not here - this file only configures what the
# scanner does once those tools are already on PATH.
