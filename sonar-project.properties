# SonarQube Cloud configuration for Rust analysis (docs/TASKS.md T-140, docs/DECISIONS.md D-92).
#
# projectKey/organization confirmed 2026-07-27 via SonarCloud's own API
# (api/organizations/search, api/projects/search) using the now-configured SONAR_TOKEN, not
# guessed from the GitHub-username convention.
sonar.projectKey=user137_uacrypt
sonar.organization=user137

sonar.sources=crates/dstu-core/src,crates/uacrypt/src
# uacrypt has no separate tests/ dir - its tests live inline in src/ as #[cfg(test)] modules,
# already covered by sonar.sources above. Confirmed by listing the actual tree, not assumed from
# dstu-core's layout (which does have a real tests/ dir) applying to both crates.
sonar.tests=crates/dstu-core/tests,crates/dstu-core/benches

# Excludes build output and vendored/gitignored oracle clones - none of this is our own code.
sonar.exclusions=target/**,oracles/**

# Rust analysis prerequisites (rustup + `rustup component add clippy`) are installed in the CI
# workflow (.github/workflows/sonarcloud.yml), not here - this file only configures what the
# scanner does once those tools are already on PATH.
