[package]
name = "uacrypt"
version = "0.4.0"
edition = "2021"
rust-version = "1.87.0"
license = "MIT OR Apache-2.0"
description = "Command-line tool for Ukrainian DSTU cryptographic standards (Kalyna, Kupyna, Strumok)"
readme = "README.md"
repository = "https://github.com/user137/uacrypt"
homepage = "https://github.com/user137/uacrypt"
documentation = "https://docs.rs/uacrypt"
keywords = ["dstu", "cli", "cryptography", "kalyna", "kupyna"]
categories = ["cryptography", "command-line-utilities"]

[lib]
name = "uacrypt"

[package.metadata.docs.rs]
all-features = true

[dependencies]
dstu-core = { path = "../dstu-core", version = "0.4.0", features = ["pwhash"] }
# Reads a passphrase from the terminal without echo (T-262, owner choice P1/F1, D-219).
rpassword = "7.5.4"
# Both already locked through dstu-core; direct for typed key files (T-256, D-212).
subtle = { version = "2.6.1", default-features = false }
zeroize = { version = "1.9.0", default-features = false, features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
# SIGINT ignored while the passphrase prompt is open (T-262, D-219); already locked through
# getrandom and rpassword.
libc = "0.2.189"
