[package]
name = "uacrypt"
version = "0.1.0"
edition = "2021"
rust-version = "1.87.0"
license = "MIT OR Apache-2.0"
description = "CLI over dstu-core"
readme = "README.md"
repository = "https://github.com/user137/uacrypt"
homepage = "https://github.com/user137/uacrypt"
documentation = "https://docs.rs/uacrypt"
keywords = ["dstu", "cli", "cryptography", "kalyna", "kupyna"]
categories = ["cryptography", "command-line-utilities"]

[lib]
name = "uacrypt"

[package.metadata.docs.rs]
all-features = true

[dependencies]
dstu-core = { path = "../dstu-core", version = "0.1.0" }
