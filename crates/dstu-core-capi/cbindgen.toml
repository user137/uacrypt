# cbindgen config for crates/dstu-core-capi (docs/DECISIONS.md D-148 point 2). Invoked via
# `cargo xtask capi`, never a build-dependency of this crate itself - see xtask/src/main.rs's
# `capi()` function.

language = "C"
header = """/* Generated by cbindgen - DO NOT EDIT BY HAND.
 * Regenerate with `cargo xtask capi` (crates/dstu-core-capi/cbindgen.toml).
 *
 * C ABI for dstu-core (Ukrainian DSTU cryptographic standards - Kalyna, Kupyna, Strumok, DSTU
 * 4145). Pre-release and provisional - see docs/SECURITY.md and docs/DECISIONS.md in the project
 * repository (https://github.com/user137/uacrypt) for the full threat model and per-construction
 * status. */"""
include_guard = "DSTU_CORE_H"
# Explicit, not just relying on cbindgen's own default (which already is LF) - pins this
# regardless of a future cbindgen version changing its default, since xtask's own header-drift
# check (capi_header_up_to_date) assumes cbindgen always emits LF and only normalizes the
# *committed* side's CRLF (from a Windows/macOS CI checkout's autocrlf translation).
line_endings = "LF"
includes = []
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
cpp_compat = true
style = "type"
# `usize`/`isize` -> `size_t`/`ptrdiff_t`, matching the spec's own C signatures (`size_t len`)
# rather than cbindgen's default `uintptr_t`/`intptr_t` (technically equivalent in width, but
# `size_t` is the idiomatic C type for a byte count/buffer length).
usize_is_size_t = true

[export]
prefix = ""

[enum]
rename_variants = "None"
prefix_with_name = false

[fn]
prefix = ""

[parse]
parse_deps = false
