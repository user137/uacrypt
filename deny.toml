# cargo-deny policy. The root workspace (dstu-core/uacrypt) has zero external dependencies - this
# file exists so the policy is enforced automatically the moment a dependency is added, rather than
# relying on someone remembering to check docs/SECURITY.md's supply-chain table by hand. Also reused
# for bindings/python's, bindings/nodejs's, bindings/ruby's, and bindings/php's separate Cargo
# workspaces (D-119): cargo-deny walks up from any cwd looking for a deny.toml, so `cargo deny
# check` run from any of them finds this same file and checks that workspace's own real dependency
# tree (pyo3/napi/magnus-rb_sys/ext-php-rs and friends) against the same policy - confirmed by
# testing, not assumed; no second deny.toml needed per binding. See
# docs/SECURITY.md "Supply-chain vetting".

[graph]
all-features = true

[licenses]
version = 2
# Permissive licenses compatible with this project's own dual MIT/Apache-2.0 (see LICENSE-MIT,
# LICENSE-APACHE) - the common set used by RustCrypto and most of the Rust crypto ecosystem this
# project expects to eventually depend on (subtle, zeroize, getrandom, argon2, thiserror, etc).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # Below: pulled in transitively by ext-php-rs's own build-dependencies (bindings/php, T-159) -
    # `zip`/`ureq`, used by its Windows build script to download and extract the matching PHP devel
    # pack at build time (docs/DECISIONS.md D-142). All permissive, all first encountered on real
    # CI (cargo-deny's own `licenses FAILED` run, not predicted locally).
    "bzip2-1.0.6", # libbz2-rs-sys, via the `bzip2`/`zip` crates
    "CC0-1.0",     # ppmd-rust, via `zip`
    "MIT-0",       # ppmd-rust, via `zip`
    "CDLA-Permissive-2.0", # webpki-root-certs, via `ureq`
    "Zlib",        # zlib-rs, via `flate2`/`ureq`/`zip`
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# No specific crate denies yet - nothing in docs/DECISIONS.md D-07 (the li0ard exclusion) publishes
# to crates.io, so there's no package name to ban here. Revisit if that changes.

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
