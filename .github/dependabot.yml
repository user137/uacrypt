# Dependabot version updates (docs/TASKS.md T-144, docs/DECISIONS.md D-100) - opens PRs when a
# newer dependency/action version exists. Nothing here auto-merges; every PR still needs a manual
# review + green CI before merging, same as any other PR (docs/CONTRIBUTING.md).
#
# Three separate `cargo` directories, not one - this workspace deliberately keeps `xtask/` and
# `crates/dstu-core/fuzz/` out of the main `[workspace]` table (see xtask/src/main.rs's own doc
# comment and .gitignore's per-directory Cargo.lock entries), so each has its own independent
# dependency graph/lockfile that Dependabot needs told about explicitly - it does not walk nested
# lockfiles from one root entry.
#
# No `commit-message.include: "scope"` below - confirmed on the first real PRs it opened
# (docs/DECISIONS.md D-100's amendment) that Dependabot's own scope value is always the literal
# word "deps", so combined with prefixes that already spell out the scope (`deps`, `deps(xtask)`,
# `deps(fuzz)`, `ci(deps)`) it only produced redundant-looking titles like "deps(deps): bump ..."
# and "deps(fuzz)(deps): update ...". Dropped it - the prefix alone already carries the scope.
version: 2

updates:
  # Main workspace: dstu-core + uacrypt - the actual shipped product.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Cargo's `versioning-strategy` only accepts `auto`/`lockfile-only` (unlike npm's wider
    # increase/widen/increase-if-necessary set - confirmed the hard way, GitHub's schema rejected
    # `increase-if-necessary` here). `lockfile-only` was considered (never touch Cargo.toml at
    # all) but rejected: it can't propose a version outside the current caret range, so a real new
    # major/minor would never surface as a PR at all - defeats the point of tracking updates on a
    # library crate meant for downstream consumption (docs/TASKS.md T-17). `auto` is Dependabot's
    # default for Cargo and already the closest match to "don't widen more than the ecosystem
    # itself requires."
    versioning-strategy: auto
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # Major bumps blocked from auto-opening entirely, not just left ungrouped - confirmed the need
    # for this the hard way (docs/DECISIONS.md D-100 amendment): a getrandom 0.3->0.4 major PR
    # opened on the very first run, and this project's own docs (D-74) already flag real,
    # documented sensitivity to getrandom's exact version behavior (the custom no_std backend
    # hook). This project's dependency set is small and individually vetted
    # (docs/SECURITY.md's supply-chain table), so a breaking change to
    # zeroize/subtle/getrandom/argon2 deserves a deliberate manual look, not an automatic PR -
    # `cargo audit` (rust.yml's own job) still independently catches known vulnerabilities
    # regardless of this, so blocking auto-proposed majors here doesn't reduce that coverage.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  # xtask - the cross-platform build/QA runner (docs/DECISIONS.md D-12), deliberately zero
  # production dependencies of its own; kept isolated so a QA-tool dependency bump can never touch
  # dstu-core/uacrypt's own dependency graph.
  - package-ecosystem: "cargo"
    directory: "/xtask"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps(xtask)"

  # cargo-fuzz targets (docs/SECURITY.md - fuzzing is a required layer, not optional tooling).
  - package-ecosystem: "cargo"
    directory: "/crates/dstu-core/fuzz"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps(fuzz)"

  # All five `.github/workflows/*.yml` files' pinned action versions (actions/checkout,
  # dtolnay/rust-toolchain, github/codeql-action, etc.) - one entry covers every workflow file,
  # Dependabot discovers them all from this single "/" directory.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "ci(deps)"
    # `dtolnay/rust-toolchain@1.87.0` in the `msrv` job (docs/DECISIONS.md D-100) is deliberately
    # pinned to this project's MSRV floor, not "whatever's current" - Dependabot can't tell that
    # apart from a normal version-bump target and proposed bumping it to 1.100.0 on the very first
    # run (PR #3), which would silently defeat the job's entire purpose *and* breaks it outright,
    # since the job's own `cargo +1.87.0` invocations further down are hardcoded and don't move
    # with the toolchain action's ref. Ignored entirely rather than left to keep recurring weekly -
    # bumping the MSRV floor itself is a deliberate project decision made by hand, not something to
    # accept via an automated PR.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
