name: release

# Triggered by a `vX.Y.Z` tag push (docs/TASKS.md T-18) - builds the uacrypt binary for
# Linux/macOS/Windows, packages the dstu-core source distribution the same way `cargo publish`
# would, builds the bindings/python wheel and bindings/nodejs addon for Linux/macOS/Windows
# (docs/TASKS.md T-49/T-50 step 5), and attaches all of it to a GitHub Release. As of the tag after
# v0.2.0 (docs/TASKS.md T-17, docs/DECISIONS.md D-114), it also publishes both crates to crates.io
# via `publish-crates` below - v0.2.0 itself predates that job and stayed GitHub-only, per an
# explicit project-owner scope decision; both crates are live as of v0.3.0 (2026-08-09). The
# `publish-pypi`/`publish-npm`/`publish-rubygems` jobs (docs/TASKS.md T-164/T-203) landed the
# automation ahead of each registry's actual first publish (same pattern T-17 used) - each still
# gated behind its own GitHub Environment manual-approval rule so a routine tag push never
# auto-publishes without a click. All three registries are live now (PyPI/npm since T-164, RubyGems
# since v0.3.8/docs/DECISIONS.md D-194) - see each job's own comment below for its current posture
# (npm still carries a bootstrap NODE_AUTH_TOKEN alongside OIDC, PyPI/RubyGems are OIDC-only).
#
# T-252 (release supply-chain hardening): the uacrypt binaries are built with `cargo auditable
# --locked`, a CycloneDX SBOM ships with them, and `assemble-release-assets` gives every release asset
# a build-provenance attestation plus a Sigstore keyless-signed SHA256SUMS. `workflow_dispatch` is a
# dry run of everything up to that point: every publishing job and step is gated on a real `v*` tag
# push, so a manual run builds, signs and attests but publishes nothing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Workflow-level default: build-binary/package-library only read the repo and upload build
# artifacts. `publish-release` overrides this with `contents: write` (already present below) since
# it actually creates the GitHub Release (docs/DECISIONS.md D-98).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # T-323 (D-267): the commit's CI can be weeks older than the tag, and a new stable rustc lands in
  # between (0.8.0 shipped on 1.100 after a green CI on 1.99, D-266). This re-runs the tests and the
  # constant-time asm check on the toolchain the uacrypt binaries and crates.io sources are built
  # with, and every publishing job needs it. It does not cover the Python wheels (maturin-action's
  # manylinux container) or the Ruby gems (rb-sys-dock's own Rust).
  verify:
    name: verify on the release toolchain (tests + asm-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # asm-check's targets, same list as rust.yml's asm-check job.
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-none,thumbv7em-none-eabihf,riscv32imc-unknown-none-elf
      - run: rustc -vV
      - run: cargo xtask test
      - run: cargo xtask asm-check

  build-binary:
    name: build uacrypt (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: uacrypt-linux-x86_64.tar.gz
          - os: macos-latest
            asset_name: uacrypt-macos-aarch64.tar.gz
          - os: windows-latest
            asset_name: uacrypt-windows-x86_64.zip
            # Static CRT: no VCRUNTIME140.dll, so the zip runs on a Windows without the VC++
            # redistributable and winget needs no VCRedist dependency (T-295, D-238).
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustc -vV
      # cargo-auditable embeds the resolved dependency list in the binary, so `cargo audit bin` can
      # check a downloaded uacrypt against RustSec (T-252). --locked: the release builds exactly
      # the committed Cargo.lock.
      - run: cargo install cargo-auditable --locked --version 0.7.6
      - run: cargo auditable build -p uacrypt --release --locked
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      - name: Check static CRT (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = [IO.File]::ReadAllBytes("target/release/uacrypt.exe")
          if ([Text.Encoding]::ASCII.GetString($exe).Contains('VCRUNTIME140')) { throw "uacrypt.exe imports VCRUNTIME140.dll" }
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          set -eu
          mkdir dist
          cp target/release/uacrypt dist/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/
          tar -czf "${{ matrix.asset_name }}" -C dist .
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/uacrypt.exe dist/
          Copy-Item README.md,LICENSE-MIT,LICENSE-APACHE dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.asset_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  package-library:
    name: package dstu-core source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustc -vV
      # Same packaging `cargo publish` would produce (respects Cargo.toml's include/exclude), but
      # without actually publishing - this job's own artifact is the downloadable source-dist
      # attached to the GitHub Release; the real `cargo publish` to crates.io happens later, in
      # `publish-crates` below. dstu-core has no path dependencies of its own, so this needs no
      # --no-verify workaround the way packaging uacrypt (a path dependency on dstu-core) would.
      - run: cargo package -p dstu-core
      - uses: actions/upload-artifact@v4
        with:
          name: dstu-core-source
          path: target/package/dstu-core-*.crate

  build-python-wheels:
    name: build python wheel (${{ matrix.os }})
    # Same PyO3/maturin-action@v1 invocation as .github/workflows/bindings-python.yml's own
    # `wheel-preview` job, proven on every push (T-49 step 5) - keep the two in sync by hand, no
    # cross-workflow includes in GitHub Actions. `bindings/python`'s own pyproject.toml is
    # versioned independently of the Rust crates (0.1.0 vs. dstu-core's 0.2.0, deliberate - this
    # binding is still provisional/pre-1.0, not lockstepped with the core crates' own release
    # cadence), so the wheel filename attached to this (or any future) GitHub Release will show
    # its own version, not the tag's.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.os }}
          path: bindings/python/dist/*.whl

  build-nodejs-artifacts:
    name: build node addon (${{ matrix.os }})
    # Same 3-OS matrix as build-python-wheels, one native addon per OS via napi-rs (D-119: separate
    # Cargo workspace, same as bindings/python), plus a 4th entry for linux-arm64-gnu (D-189).
    # bindings/nodejs/package.json's napi.triples pins the explicit x86_64-unknown-linux-gnu/
    # aarch64-apple-darwin/x86_64-pc-windows-msvc/aarch64-unknown-linux-gnu triples - not napi-rs's
    # own "defaults: true" preset, which assumes x86_64-apple-darwin. GitHub's macos-latest runner is
    # Apple Silicon (arm64), the same target uacrypt's own release binary already uses (see
    # build-binary's uacrypt-macos-aarch64.tar.gz above) - defaults:true would have scaffolded a
    # platform package this CI can never actually produce a matching binary for.
    # `ubuntu-24.04-arm` builds aarch64-unknown-linux-gnu natively (host triple == target triple, no
    # cross-compile toolchain/Docker image needed) - GA for public repos since 2025-08-07 (D-189).
    # napi-rs's own official CI template cross-compiles this target via a Docker image only because
    # it can't assume a native arm64 runner exists; this project's does, so `npm run build` (no
    # explicit --target) auto-detects the host and Just Works, same as the other 3 matrix entries.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustc -vV
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: bindings/nodejs
      - run: npm run build
        working-directory: bindings/nodejs
      - uses: actions/upload-artifact@v4
        with:
          name: node-native-${{ matrix.os }}
          path: bindings/nodejs/native/*.node
      # napi's generated JS loader and typings - the same on every OS; taken from one leg (D-270).
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: node-loader
          path: |
            bindings/nodejs/native/index.js
            bindings/nodejs/native/index.d.ts

  build-ruby-gems:
    name: build ruby gem (${{ matrix.platform }})
    # Cross-compiled from a single ubuntu-latest host via oxidize-rb/actions/cross-gem (a
    # `rb-sys-dock` wrapper, itself a `rake-compiler-dock` derivative) - unlike
    # build-python-wheels/build-nodejs-artifacts, this does NOT need a matching-OS runner per
    # platform: rb-sys-dock ships prebuilt cross Ruby + cross Rust toolchains (bindgen/clang
    # included) for every target inside its own Docker images, the same mechanism nokogiri/grpc
    # et al. have shipped precompiled darwin/mingw native gems with for years - confirmed by
    # reading rb-sys-dock's own source (gem/exe/rb-sys-dock in oxidize-rb/rb-sys) rather than
    # assumed. bindings-ruby.yml's own MSYS2/D-133 clang dance is a *local test-build* concern
    # (linking/running against a real installed Windows Ruby for RSpec) - it doesn't apply here.
    #
    # The Docker `docker run -v $(pwd):$(pwd)` mount is the whole repo (not just
    # working-directory), so `ext/dstu_core_rb/Cargo.toml`'s `../../../../crates/dstu-core` path
    # dependency resolves inside the container exactly as it does locally - verified by reading
    # the mount logic, not assumed; a working-directory-only mount would have silently broken
    # this monorepo layout.
    #
    # Setting RUBY_TARGET (which rb-sys-dock does internally, matching --platform) is what makes
    # bindings/ruby's existing Rakefile/RbSys::ExtensionTask define the `native:$RUBY_TARGET gem`
    # task at all (see ExtensionTask#init: `@cross_compile = ENV.key?("RUBY_TARGET")`) - no
    # Rakefile changes needed for this to work.
    #
    # Platform set mirrors build-nodejs-artifacts' own choice (linux-x64/arm64-gnu, darwin-arm64,
    # a Windows target) - deliberately no x86_64-darwin, matching this project's standing policy
    # of only ever targeting Apple Silicon macOS (build-binary's own uacrypt release asset is
    # macos-aarch64 only; build-nodejs-artifacts' own comment has the same reasoning).
    strategy:
      fail-fast: false
      matrix:
        platform: [x86_64-linux, aarch64-linux, arm64-darwin, x64-mingw-ucrt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: bindings/ruby
      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          working-directory: bindings/ruby
          # Explicit, not rb-sys-dock's own default: confirmed the hard way (first real run of
          # this job, all 4 platforms failed identically) that leaving ruby-versions unset makes
          # rb-sys-dock also cross-compile against Ruby 4.0's headers, and magnus 0.7.1 (this
          # binding's own dependency, Cargo.toml) doesn't support Ruby 4.0's changed C ABI yet
          # (rb_fiber_raise's argv mutability, RTypedData losing its typed_flag field) - a real
          # upstream incompatibility, not a config mistake on this project's side. Pinned to the
          # same range bindings-ruby.yml's own test job and the gemspec's required_ruby_version
          # (">= 3.1") already cover - re-check/widen once magnus adds Ruby 4.0 support.
          ruby-versions: "3.1,3.2,3.3,3.4"
      - uses: actions/upload-artifact@v4
        with:
          name: ruby-gem-${{ matrix.platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}

  # D-268: the cross-built gems put the extension under lib/dstu_core/<ruby minor>/, a layout no CI
  # job ever loaded - 0.1.0 to 0.5.1 were published unloadable. Install each built gem on its own
  # OS, as a user would, and require it before anything is pushed.
  load-ruby-gems:
    name: load ruby gem (${{ matrix.platform }}, ruby ${{ matrix.ruby }})
    needs: build-ruby-gems
    strategy:
      fail-fast: false
      matrix:
        platform: [x86_64-linux, aarch64-linux, arm64-darwin, x64-mingw-ucrt]
        ruby: ["3.1", "3.2", "3.3", "3.4"]
        include:
          - { platform: x86_64-linux, os: ubuntu-latest }
          - { platform: aarch64-linux, os: ubuntu-24.04-arm }
          - { platform: arm64-darwin, os: macos-latest }
          - { platform: x64-mingw-ucrt, os: windows-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - uses: actions/download-artifact@v4
        with:
          name: ruby-gem-${{ matrix.platform }}
          path: gems
      - name: Install the built gem and run its selftest outside the repo
        run: |
          set -euo pipefail
          gem install --local --no-document gems/*.gem
          cd "$RUNNER_TEMP"
          ruby -e 'require "dstu_core"; DstuCore.self_test; puts "dstu_core #{DstuCore::VERSION} loads on ruby #{RUBY_VERSION}"'

  sbom:
    name: CycloneDX SBOM for uacrypt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustc -vV
      - run: cargo install cargo-cyclonedx --locked --version 0.5.9
      # --target all: one SBOM covering the dependencies of every platform the binaries ship for.
      # It writes one file per workspace member; only uacrypt's is a release asset.
      - run: >-
          cargo cyclonedx --manifest-path crates/uacrypt/Cargo.toml -f json --spec-version 1.5
          --target all --override-filename uacrypt.cdx
      - uses: actions/upload-artifact@v4
        with:
          name: uacrypt-sbom
          path: crates/uacrypt/uacrypt.cdx.json

  assemble-release-assets:
    name: checksums, signature, provenance
    # Every build job is a dependency, so the asset set is fixed: before T-252 the Node addons and
    # Ruby gems reached the release only when their jobs happened to finish first, and a checksum
    # file must not silently miss what lost that race. A failed build blocks the release, as before.
    needs:
      - build-binary
      - package-library
      - build-python-wheels
      - build-nodejs-artifacts
      - build-ruby-gems
      - sbom
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts into one directory
        run: |
          set -eu
          mkdir -p release-assets
          dups=$(find artifacts -type f -printf '%f\n' | sort | uniq -d)
          if [ -n "$dups" ]; then echo "duplicate asset names: $dups"; exit 1; fi
          find artifacts -type f -exec cp {} release-assets/ \;
          ls -la release-assets
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: SHA256SUMS
        working-directory: release-assets
        run: |
          set -eu
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Keyless: the certificate names this workflow run's identity, there is no key to keep.
      # The self-check pins the exact workflow ref, which docs/CLI.md's user-facing command narrows
      # to a release tag.
      - name: Sign and verify SHA256SUMS
        working-directory: release-assets
        run: |
          set -eu
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${{ github.workflow_ref }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/*

  publish-release:
    name: create GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [assemble-release-assets, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

  publish-pypi:
    # Owner configured a PyPI Trusted Publisher (pypi.org web UI) for project `dstu-core`, repo
    # `user137/uacrypt`, workflow `release.yml`, environment `pypi` below - live since T-164. No
    # token/secret anywhere in this job by design - PyPI's OIDC Trusted Publishing is the direct
    # fix for the crates.io token-leak incident T-203/docs/TASKS.md records (a pasted `cargo login`
    # token landed in the chat transcript twice). `environment: pypi` adds a second, independent
    # safety layer: a routine future `v*` tag (a patch release) still needs a manual approval click
    # in that GitHub Environment's protection rules before this job runs - it does not silently
    # auto-publish just because a tag was pushed.
    name: publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-python-wheels, verify]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # bindings/python's own version (0.1.1) isn't lockstepped with the tag - a future tag
          # whose Python binding hasn't changed would otherwise hard-fail re-uploading identical
          # wheels PyPI already has (confirmed the hard way, v0.3.1 -> v0.3.2, T-164/T-203).
          skip-existing: true

  # D-270: every npm `dstu-core` root package published so far lacked `native/index.js` (napi's
  # generated loader, gitignored, built by `npm run build`), so `require('dstu-core')` failed on every
  # OS. Packaging now happens here, in the dry run too, and `load-npm-package` installs the exact
  # tarballs on each OS before `publish-npm` pushes those same files.
  #
  # napi-rs's own documented recipe (napi.rs/docs/deep-dive/release): `create-npm-dir` scaffolds one
  # subpackage directory per configured triple (gitignored, regenerated fresh here every run - see
  # .gitignore's /bindings/nodejs/npm/ entry), `artifacts` copies the downloaded per-OS `.node`
  # binaries into the matching subpackage. napi artifacts' default source dir is `artifacts/`, not
  # `native/` - getting that wrong leaves every subpackage silently empty.
  #
  # The win32 `.node` also goes into the root package's own `native/`: `dstu-core-win32-x64-msvc` is
  # blocked by npm's spam detection (D-189), and napi's loader tries a `.node` beside itself before
  # the platform package, so Windows works from the root package alone (D-270).
  pack-npm:
    name: pack npm packages
    needs: build-nodejs-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        working-directory: bindings/nodejs
      - uses: actions/download-artifact@v4
        with:
          pattern: node-native-*
          path: bindings/nodejs/artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: node-loader
          path: bindings/nodejs/native
      - run: npx napi create-npm-dir -t .
        working-directory: bindings/nodejs
      - run: npx napi artifacts
        working-directory: bindings/nodejs
      - name: Win32 addon into the root package (D-189, D-270)
        working-directory: bindings/nodejs
        run: cp npm/win32-x64-msvc/dstu-core.win32-x64-msvc.node native/
      # Root package's optionalDependencies is the one other thing `napi prepublish` did besides
      # publishing each subpackage - replicated here since the publish loop doesn't use that command.
      - name: Set root package optionalDependencies
        working-directory: bindings/nodejs
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const platforms = ["linux-x64-gnu", "darwin-arm64", "win32-x64-msvc", "linux-arm64-gnu"];
            pkg.optionalDependencies = Object.fromEntries(
              platforms.map((p) => [`${pkg.name}-${p}`, pkg.version])
            );
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
      - name: Pack root and platform packages, check the root's contents
        working-directory: bindings/nodejs
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/npm-dist/platforms"
          root=$(npm pack --silent --pack-destination "$GITHUB_WORKSPACE/npm-dist")
          for dir in npm/*/; do
            (cd "$dir" && npm pack --silent --pack-destination "$GITHUB_WORKSPACE/npm-dist/platforms")
          done
          ls -R "$GITHUB_WORKSPACE/npm-dist"
          contents=$(tar -tzf "$GITHUB_WORKSPACE/npm-dist/$root")
          echo "$contents"
          for f in package/js/index.js package/native/index.js package/native/index.d.ts \
                   package/native/dstu-core.win32-x64-msvc.node; do
            echo "$contents" | grep -qx "$f" || { echo "root package lacks $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: npm-dist

  load-npm-package:
    name: load npm package (${{ matrix.os }})
    needs: pack-npm
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x64-gnu }
          - { os: ubuntu-24.04-arm, platform: linux-arm64-gnu }
          - { os: macos-latest, platform: darwin-arm64 }
          # No platform package: Windows must load from the root package alone (D-270).
          - { os: windows-latest, platform: "" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: npm-dist
      - name: Unpack the tarballs into a clean node_modules and run the selftest
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          dist="$PWD/npm-dist"
          # POSIX path: GNU tar reads the `D:` of a Windows $RUNNER_TEMP as a remote host.
          app="$PWD/npm-app"
          mkdir -p "$app/node_modules/dstu-core"
          tar -xzf "$dist"/dstu-core-[0-9]*.tgz -C "$app/node_modules/dstu-core" --strip-components=1
          if [ -n "$PLATFORM" ]; then
            mkdir -p "$app/node_modules/dstu-core-$PLATFORM"
            tar -xzf "$dist"/platforms/dstu-core-"$PLATFORM"-*.tgz \
              -C "$app/node_modules/dstu-core-$PLATFORM" --strip-components=1
          fi
          cd "$app"
          node -e "require('dstu-core').selfTest(); console.log('dstu-core loads on ' + process.platform + '-' + process.arch)"

  publish-npm:
    # Same `environment: npm` manual-approval gate as publish-pypi above (both environments got
    # real `required_reviewers` protection added via the GitHub API on 2026-08-12, after the v0.3.1
    # PyPI run exposed that just referencing `environment:` in this file doesn't create one - GitHub
    # auto-creates it with zero protection rules on first use).
    #
    # Bootstrap exception, temporary: unlike PyPI, npm has no "pending trusted publisher" - the
    # npmjs.com UI requires a package to already exist before a Trusted Publisher can be configured
    # for it (open upstream issue, npm/cli#8544, confirmed live 2026-08-12), so a genuinely
    # never-published package can't use OIDC for its first version. `NODE_AUTH_TOKEN` below (an npm
    # Automation token, repo secret `NPM_TOKEN`) covers only that one bootstrap publish - the owner
    # pasted it directly into GitHub's own secret UI, never into chat, same "no token in the
    # transcript" principle the crates.io incident (docs/TASKS.md T-203) established, just via a
    # different mechanism than OIDC since OIDC alone can't reach a first publish here. Once
    # `dstu-core` exists on npm, configure Trusted Publishing on its package settings page and
    # remove both `NODE_AUTH_TOKEN` below and the `NPM_TOKEN` secret - every release after the first
    # should be OIDC-only, matching publish-pypi.
    #
    # Publishes the tarballs `pack-npm` built and `load-npm-package` loaded, not a fresh build.
    # Deliberately NOT `napi prepublish`: its per-platform loop aborts the whole command - root
    # package included - the instant any ONE platform's `npm publish` fails, with no tolerance for
    # "this version already exists" (confirmed 2026-08-12). A retry of a partially-succeeded publish
    # is the normal case here (npm's spam heuristic and rate limits are real and external), so every
    # step below tolerates "already published" and picks up where the previous attempt stopped.
    name: publish to npm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [load-npm-package, verify]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing (OIDC) needs a recent npm CLI, and `npm@latest` itself now requires
          # Node >=22 (confirmed 2026-08-12: `npm install -g npm@latest` failed on Node 20 with
          # EBADENGINE).
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: npm-dist
      - name: Publish platform packages, then the root (tolerating already-published)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # dstu-core-win32-x64-msvc is skipped, not attempted-and-tolerated: npm's spam detection
        # blocks the name (external, not time-based, D-189); the root package carries that addon
        # instead (D-270). Remove the skip once npm support clears the name.
        run: |
          set -euo pipefail
          publish() {
            set +e
            output=$(npm publish "$1" --provenance --ignore-scripts 2>&1)
            status=$?
            set -e
            echo "$output"
            if [ $status -ne 0 ] && ! echo "$output" | grep -q "cannot publish over the previously published versions"; then
              exit $status
            fi
          }
          for tgz in npm-dist/platforms/*.tgz; do
            case "$tgz" in
              *dstu-core-win32-x64-msvc-*) echo "== Skipping $tgz (D-189) =="; continue ;;
            esac
            echo "== Publishing $tgz =="
            publish "$tgz"
          done
          for tgz in npm-dist/dstu-core-[0-9]*.tgz; do
            echo "== Publishing root $tgz =="
            publish "$tgz"
          done

  publish-rubygems:
    # Trusted Publishing (OIDC), same "environment gate + no static secret" posture as
    # publish-pypi - RubyGems, like PyPI and unlike npm (D-189's bootstrap-token workaround),
    # supports a "pending trusted publisher" for a gem that doesn't exist yet
    # (guides.rubygems.org/trusted-publishing), so no bootstrap token was ever needed here even
    # for the very first publish. Owner registered the pending publisher on rubygems.org
    # (gem dstu_core, repo user137/uacrypt, workflow release.yml, environment rubygems)
    # 2026-08-13 ahead of this job landing - same "automation ahead of the actual first publish"
    # pattern T-17/publish-pypi already used.
    #
    # rubygems/release-gem (RubyGems' own documented one-call recipe) isn't used here -
    # confirmed by reading its source (rubygems/release-gem's action.yml): it runs
    # `bundle exec rake release`, which builds and pushes a single SOURCE gem plus a brand-new
    # git tag. That doesn't fit a multi-platform native-gem release, where the gems are already
    # built by build-ruby-gems (cross-compiled per platform, real compiled extensions inside) and
    # the tag already exists. rubygems/configure-rubygems-credentials - the credential step
    # release-gem itself wraps - is the right building block on its own: it sets up OIDC-based
    # `gem push` credentials for this job, then plain `gem push` per downloaded artifact does the
    # rest.
    #
    # No "already published" tolerance loop like publish-npm's, by design, not an oversight:
    # confirmed by reading rubygems.org's own Pusher model (app/models/pusher.rb) that a repeat
    # push of an identical, already-indexed version returns HTTP 200 "Gem was already pushed"
    # rather than erroring - `gem push` is naturally idempotent here, unlike npm's hard 403 on
    # any repeat publish attempt. The grep below only guards the genuine-conflict case (same
    # version/platform, different content).
    name: publish to RubyGems
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-ruby-gems, load-ruby-gems, verify]
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      id-token: write
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: actions/download-artifact@v4
        with:
          pattern: ruby-gem-*
          path: gems
          merge-multiple: true
      # No floating `v1`/`v2` tag exists on this action (confirmed via its real tag list,
      # `gh api repos/rubygems/configure-rubygems-credentials/tags` - only full semver tags) -
      # `@v1` failed release resolution outright on v0.3.7's first real run ("unable to find
      # version v1"). Pinned to the exact SHA/version `rubygems/release-gem`'s own action.yml uses
      # internally for this same step, the authoritative source for what's current and correct.
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Push gems (tolerating a genuine already-published conflict)
        run: |
          for gem in gems/*.gem; do
            echo "== Pushing $gem =="
            set +e
            output=$(gem push "$gem" 2>&1)
            status=$?
            set -e
            echo "$output"
            if [ $status -ne 0 ]; then
              if echo "$output" | grep -qi "repushing of gem versions is not allowed"; then
                echo "Already published, continuing: $gem"
              else
                exit $status
              fi
            fi
          done

  publish-crates:
    # v0.2.0 itself predates this job (added in a later commit than the v0.2.0 tag, T-17/D-114) -
    # crates.io publication starts from the next tag onward, per the project owner's explicit
    # scope decision. dstu-core must land first since uacrypt's packaged manifest resolves it as a
    # registry dependency (version = "0.2.0"), not the local path - path deps are stripped from the
    # published Cargo.toml, so uacrypt's own `cargo publish` verification build would fail against
    # crates.io until dstu-core is actually there.
    # Needs only the builds, not publish-release (T-252): a failure in the signing/SBOM/attestation
    # steps must never hold back a security fix's crates.io release.
    name: publish to crates.io
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-binary, package-library, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustc -vV
      - run: cargo publish -p dstu-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for crates.io index to pick up dstu-core
        run: sleep 30
      - run: cargo publish -p uacrypt
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
