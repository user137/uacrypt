name: release

# Triggered by a `vX.Y.Z` tag push (docs/TASKS.md T-18) - builds the uacrypt binary for
# Linux/macOS/Windows, packages the dstu-core source distribution the same way `cargo publish`
# would, builds the bindings/python wheel and bindings/nodejs addon for Linux/macOS/Windows
# (docs/TASKS.md T-49/T-50 step 5), and attaches all of it to a GitHub Release. As of the tag after
# v0.2.0 (docs/TASKS.md T-17, docs/DECISIONS.md D-114), it also publishes both crates to crates.io
# via `publish-crates` below - v0.2.0 itself predates that job and stayed GitHub-only, per an
# explicit project-owner scope decision; both crates are live as of v0.3.0 (2026-08-09). The
# `publish-pypi`/`publish-npm`/`publish-rubygems` jobs (docs/TASKS.md T-164/T-203) exist but are
# dormant behind their own GitHub Environment approval gate until the owner separately configures
# Trusted Publishing on each registry - landing the automation ahead of the actual first publish,
# same pattern T-17 used.
on:
  push:
    tags:
      - "v*"

# Workflow-level default: build-binary/package-library only read the repo and upload build
# artifacts. `publish-release` overrides this with `contents: write` (already present below) since
# it actually creates the GitHub Release (docs/DECISIONS.md D-98).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binary:
    name: build uacrypt (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: uacrypt-linux-x86_64.tar.gz
          - os: macos-latest
            asset_name: uacrypt-macos-aarch64.tar.gz
          - os: windows-latest
            asset_name: uacrypt-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p uacrypt --release
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          set -eu
          mkdir dist
          cp target/release/uacrypt dist/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/
          tar -czf "${{ matrix.asset_name }}" -C dist .
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/uacrypt.exe dist/
          Copy-Item README.md,LICENSE-MIT,LICENSE-APACHE dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.asset_name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  package-library:
    name: package dstu-core source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Same packaging `cargo publish` would produce (respects Cargo.toml's include/exclude), but
      # without actually publishing to crates.io - T-17 stays separately gated. dstu-core has no
      # path dependencies of its own, so this needs no --no-verify workaround the way packaging
      # uacrypt (a path dependency on dstu-core, unpublished) would.
      - run: cargo package -p dstu-core
      - uses: actions/upload-artifact@v4
        with:
          name: dstu-core-source
          path: target/package/dstu-core-*.crate

  build-python-wheels:
    name: build python wheel (${{ matrix.os }})
    # Same PyO3/maturin-action@v1 invocation as .github/workflows/bindings-python.yml's own
    # `wheel-preview` job, proven on every push (T-49 step 5) - keep the two in sync by hand, no
    # cross-workflow includes in GitHub Actions. `bindings/python`'s own pyproject.toml is
    # versioned independently of the Rust crates (0.1.0 vs. dstu-core's 0.2.0, deliberate - this
    # binding is still provisional/pre-1.0, not lockstepped with the core crates' own release
    # cadence), so the wheel filename attached to this (or any future) GitHub Release will show
    # its own version, not the tag's.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.os }}
          path: bindings/python/dist/*.whl

  build-nodejs-artifacts:
    name: build node addon (${{ matrix.os }})
    # Same 3-OS matrix as build-python-wheels, one native addon per OS via napi-rs (D-119: separate
    # Cargo workspace, same as bindings/python), plus a 4th entry for linux-arm64-gnu (D-189).
    # bindings/nodejs/package.json's napi.triples pins the explicit x86_64-unknown-linux-gnu/
    # aarch64-apple-darwin/x86_64-pc-windows-msvc/aarch64-unknown-linux-gnu triples - not napi-rs's
    # own "defaults: true" preset, which assumes x86_64-apple-darwin. GitHub's macos-latest runner is
    # Apple Silicon (arm64), the same target uacrypt's own release binary already uses (see
    # build-binary's uacrypt-macos-aarch64.tar.gz above) - defaults:true would have scaffolded a
    # platform package this CI can never actually produce a matching binary for.
    # `ubuntu-24.04-arm` builds aarch64-unknown-linux-gnu natively (host triple == target triple, no
    # cross-compile toolchain/Docker image needed) - GA for public repos since 2025-08-07 (D-189).
    # napi-rs's own official CI template cross-compiles this target via a Docker image only because
    # it can't assume a native arm64 runner exists; this project's does, so `npm run build` (no
    # explicit --target) auto-detects the host and Just Works, same as the other 3 matrix entries.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: bindings/nodejs
      - run: npm run build
        working-directory: bindings/nodejs
      - uses: actions/upload-artifact@v4
        with:
          name: node-native-${{ matrix.os }}
          path: bindings/nodejs/native/*.node

  build-ruby-gems:
    name: build ruby gem (${{ matrix.platform }})
    # Cross-compiled from a single ubuntu-latest host via oxidize-rb/actions/cross-gem (a
    # `rb-sys-dock` wrapper, itself a `rake-compiler-dock` derivative) - unlike
    # build-python-wheels/build-nodejs-artifacts, this does NOT need a matching-OS runner per
    # platform: rb-sys-dock ships prebuilt cross Ruby + cross Rust toolchains (bindgen/clang
    # included) for every target inside its own Docker images, the same mechanism nokogiri/grpc
    # et al. have shipped precompiled darwin/mingw native gems with for years - confirmed by
    # reading rb-sys-dock's own source (gem/exe/rb-sys-dock in oxidize-rb/rb-sys) rather than
    # assumed. bindings-ruby.yml's own MSYS2/D-133 clang dance is a *local test-build* concern
    # (linking/running against a real installed Windows Ruby for RSpec) - it doesn't apply here.
    #
    # The Docker `docker run -v $(pwd):$(pwd)` mount is the whole repo (not just
    # working-directory), so `ext/dstu_core_rb/Cargo.toml`'s `../../../../crates/dstu-core` path
    # dependency resolves inside the container exactly as it does locally - verified by reading
    # the mount logic, not assumed; a working-directory-only mount would have silently broken
    # this monorepo layout.
    #
    # Setting RUBY_TARGET (which rb-sys-dock does internally, matching --platform) is what makes
    # bindings/ruby's existing Rakefile/RbSys::ExtensionTask define the `native:$RUBY_TARGET gem`
    # task at all (see ExtensionTask#init: `@cross_compile = ENV.key?("RUBY_TARGET")`) - no
    # Rakefile changes needed for this to work.
    #
    # Platform set mirrors build-nodejs-artifacts' own choice (linux-x64/arm64-gnu, darwin-arm64,
    # a Windows target) - deliberately no x86_64-darwin, matching this project's standing policy
    # of only ever targeting Apple Silicon macOS (build-binary's own uacrypt release asset is
    # macos-aarch64 only; build-nodejs-artifacts' own comment has the same reasoning).
    strategy:
      fail-fast: false
      matrix:
        platform: [x86_64-linux, aarch64-linux, arm64-darwin, x64-mingw-ucrt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: bindings/ruby
      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          working-directory: bindings/ruby
          # Explicit, not rb-sys-dock's own default: confirmed the hard way (first real run of
          # this job, all 4 platforms failed identically) that leaving ruby-versions unset makes
          # rb-sys-dock also cross-compile against Ruby 4.0's headers, and magnus 0.7.1 (this
          # binding's own dependency, Cargo.toml) doesn't support Ruby 4.0's changed C ABI yet
          # (rb_fiber_raise's argv mutability, RTypedData losing its typed_flag field) - a real
          # upstream incompatibility, not a config mistake on this project's side. Pinned to the
          # same range bindings-ruby.yml's own test job and the gemspec's required_ruby_version
          # (">= 3.1") already cover - re-check/widen once magnus adds Ruby 4.0 support.
          ruby-versions: "3.1,3.2,3.3,3.4"
      - uses: actions/upload-artifact@v4
        with:
          name: ruby-gem-${{ matrix.platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}

  publish-release:
    name: create GitHub release
    # Wheel-build failure blocks the release (same posture as package-library) - a deliberate
    # choice, not a side effect: this binding's own CI (bindings-python.yml) already gates
    # correctness/interop on every push, so a release-time wheel-build failure here means the
    # packaging step itself broke, which should stop the release rather than ship silently without
    # wheels attached.
    needs: [build-binary, package-library, build-python-wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts into one directory
        run: |
          set -eu
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          ls -la release-assets
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

  publish-pypi:
    # Dormant until the owner configures a PyPI Trusted Publisher (pypi.org web UI, needs their
    # login - cannot be done from this session) for project `dstu-core`, repo `user137/uacrypt`,
    # workflow `release.yml`, environment `pypi` below. No token/secret anywhere in this job by
    # design - PyPI's OIDC Trusted Publishing is the direct fix for the crates.io token-leak
    # incident T-203/docs/TASKS.md records (a pasted `cargo login` token landed in the chat
    # transcript twice). `environment: pypi` adds a second, independent safety layer: even once
    # Trusted Publishing is enabled, a routine future `v*` tag (a patch release) still needs a
    # manual approval click in that GitHub Environment's protection rules before this job runs -
    # it does not silently auto-publish just because a tag was pushed.
    name: publish to PyPI
    needs: build-python-wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # bindings/python's own version (0.1.1) isn't lockstepped with the tag - a future tag
          # whose Python binding hasn't changed would otherwise hard-fail re-uploading identical
          # wheels PyPI already has (confirmed the hard way, v0.3.1 -> v0.3.2, T-164/T-203).
          skip-existing: true

  publish-npm:
    # Same `environment: npm` manual-approval gate as publish-pypi above (both environments got
    # real `required_reviewers` protection added via the GitHub API on 2026-08-12, after the v0.3.1
    # PyPI run exposed that just referencing `environment:` in this file doesn't create one - GitHub
    # auto-creates it with zero protection rules on first use).
    #
    # Bootstrap exception, temporary: unlike PyPI, npm has no "pending trusted publisher" - the
    # npmjs.com UI requires a package to already exist before a Trusted Publisher can be configured
    # for it (open upstream issue, npm/cli#8544, confirmed live 2026-08-12), so a genuinely
    # never-published package can't use OIDC for its first version. `NODE_AUTH_TOKEN` below (an npm
    # Automation token, repo secret `NPM_TOKEN`) covers only that one bootstrap publish - the owner
    # pasted it directly into GitHub's own secret UI, never into chat, same "no token in the
    # transcript" principle the crates.io incident (docs/TASKS.md T-203) established, just via a
    # different mechanism than OIDC since OIDC alone can't reach a first publish here. Once
    # `dstu-core` exists on npm, configure Trusted Publishing on its package settings page and
    # remove both `NODE_AUTH_TOKEN` below and the `NPM_TOKEN` secret - every release after the first
    # should be OIDC-only, matching publish-pypi.
    #
    # napi-rs's own documented recipe (napi.rs/docs/deep-dive/release, checked this session):
    # `create-npm-dir` scaffolds one subpackage directory per configured triple (gitignored,
    # regenerated fresh here every run - see .gitignore's /bindings/nodejs/npm/ entry), `artifacts`
    # copies the downloaded per-OS `.node` binaries into the matching subpackage.
    #
    # Deliberately NOT using `napi prepublish` (root `npm publish`'s own `prepublishOnly` hook) to
    # drive the actual publishing, unlike napi-rs's own documented one-call recipe: its per-platform
    # loop (`PrePublishCommand.execute` in @napi-rs/cli) aborts the whole command - root package
    # included - the instant any ONE platform's `npm publish` fails, with no tolerance for "this
    # version already exists". Confirmed the hard way, 2026-08-12: a retry after npm's own
    # spam-detection blocked the 3rd platform package died instead on the 1st (already-published
    # from the prior attempt), never reaching the 3rd or the root package at all. A retry of a
    # partially-succeeded publish is the normal case here (npm's spam heuristic and rate limits are
    # both real, external, and not something this workflow controls), so every step below is written
    # to tolerate "already published" and pick up wherever the previous attempt stopped.
    name: publish to npm
    needs: build-nodejs-artifacts
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing (OIDC) needs a recent npm CLI, and `npm@latest` itself now requires
          # Node >=22 (confirmed the hard way, 2026-08-12: `npm install -g npm@latest` failed on
          # Node 20 with EBADENGINE) - Node 20 is still fine for the rest of this project's own
          # bindings-nodejs.yml (`engines.node: >= 18`), this job alone needs the newer runtime.
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: npm install
        working-directory: bindings/nodejs
      # napi artifacts' own default source dir is `artifacts/` (relative to its cwd), not
      # `native/` - confirmed by reading @napi-rs/cli's ArtifactsCommand source this session
      # (its `-d,--dir` flag defaults to `'artifacts'`). Getting this wrong would leave every
      # platform subpackage silently empty - `napi artifacts` doesn't error when it finds zero
      # matching files, it just publishes packages with no binary inside.
      - uses: actions/download-artifact@v4
        with:
          pattern: node-native-*
          path: bindings/nodejs/artifacts
          merge-multiple: true
      - run: npx napi create-npm-dir -t .
        working-directory: bindings/nodejs
      - run: npx napi artifacts
        working-directory: bindings/nodejs
      # Root package's optionalDependencies is the one other thing `napi prepublish` did besides
      # publishing each subpackage (docs/DECISIONS.md note above) - replicated here directly so it
      # keeps happening even though the publish loop itself no longer goes through that command.
      - name: Set root package optionalDependencies
        working-directory: bindings/nodejs
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const platforms = ["linux-x64-gnu", "darwin-arm64", "win32-x64-msvc", "linux-arm64-gnu"];
            pkg.optionalDependencies = Object.fromEntries(
              platforms.map((p) => [`${pkg.name}-${p}`, pkg.version])
            );
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
      - name: Publish platform subpackages (tolerating already-published)
        working-directory: bindings/nodejs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # dstu-core-win32-x64-msvc is deliberately skipped here, not attempted-and-tolerated like
        # the "already published" case below: it's blocked by npm's own spam detection (external,
        # not time-based - confirmed by a 3+ hour wait reproducing the identical block), and no
        # retry from this job can fix that. docs/DECISIONS.md D-189 has the full incident and the
        # real fix (npm support). Remove this skip once support clears the name - the napi `triples`
        # config still builds this platform every release, so it's ready to publish immediately.
        run: |
          for dir in npm/*/; do
            if [ "$dir" = "npm/win32-x64-msvc/" ]; then
              echo "== Skipping $dir - blocked by npm spam detection, see docs/DECISIONS.md D-189 =="
              continue
            fi
            echo "== Publishing $dir =="
            set +e
            output=$(cd "$dir" && npm publish --provenance 2>&1)
            status=$?
            set -e
            echo "$output"
            if [ $status -ne 0 ]; then
              if echo "$output" | grep -q "cannot publish over the previously published versions"; then
                echo "Already published, continuing: $dir"
              else
                exit $status
              fi
            fi
          done
      - name: Publish root package (tolerating already-published)
        working-directory: bindings/nodejs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set +e
          output=$(npm publish --provenance --ignore-scripts 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ $status -ne 0 ] && ! echo "$output" | grep -q "cannot publish over the previously published versions"; then
            exit $status
          fi

  publish-rubygems:
    # Trusted Publishing (OIDC), same "environment gate + no static secret" posture as
    # publish-pypi - RubyGems, like PyPI and unlike npm (D-189's bootstrap-token workaround),
    # supports a "pending trusted publisher" for a gem that doesn't exist yet
    # (guides.rubygems.org/trusted-publishing), so no bootstrap token was ever needed here even
    # for the very first publish. Owner registered the pending publisher on rubygems.org
    # (gem dstu_core, repo user137/uacrypt, workflow release.yml, environment rubygems)
    # 2026-08-13 ahead of this job landing - same "automation ahead of the actual first publish"
    # pattern T-17/publish-pypi already used.
    #
    # rubygems/release-gem (RubyGems' own documented one-call recipe) isn't used here -
    # confirmed by reading its source (rubygems/release-gem's action.yml): it runs
    # `bundle exec rake release`, which builds and pushes a single SOURCE gem plus a brand-new
    # git tag. That doesn't fit a multi-platform native-gem release, where the gems are already
    # built by build-ruby-gems (cross-compiled per platform, real compiled extensions inside) and
    # the tag already exists. rubygems/configure-rubygems-credentials - the credential step
    # release-gem itself wraps - is the right building block on its own: it sets up OIDC-based
    # `gem push` credentials for this job, then plain `gem push` per downloaded artifact does the
    # rest.
    #
    # No "already published" tolerance loop like publish-npm's, by design, not an oversight:
    # confirmed by reading rubygems.org's own Pusher model (app/models/pusher.rb) that a repeat
    # push of an identical, already-indexed version returns HTTP 200 "Gem was already pushed"
    # rather than erroring - `gem push` is naturally idempotent here, unlike npm's hard 403 on
    # any repeat publish attempt. The grep below only guards the genuine-conflict case (same
    # version/platform, different content).
    name: publish to RubyGems
    needs: build-ruby-gems
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      id-token: write
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: actions/download-artifact@v4
        with:
          pattern: ruby-gem-*
          path: gems
          merge-multiple: true
      # No floating `v1`/`v2` tag exists on this action (confirmed via its real tag list,
      # `gh api repos/rubygems/configure-rubygems-credentials/tags` - only full semver tags) -
      # `@v1` failed release resolution outright on v0.3.7's first real run ("unable to find
      # version v1"). Pinned to the exact SHA/version `rubygems/release-gem`'s own action.yml uses
      # internally for this same step, the authoritative source for what's current and correct.
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Push gems (tolerating a genuine already-published conflict)
        run: |
          for gem in gems/*.gem; do
            echo "== Pushing $gem =="
            set +e
            output=$(gem push "$gem" 2>&1)
            status=$?
            set -e
            echo "$output"
            if [ $status -ne 0 ]; then
              if echo "$output" | grep -qi "repushing of gem versions is not allowed"; then
                echo "Already published, continuing: $gem"
              else
                exit $status
              fi
            fi
          done

  publish-crates:
    # v0.2.0 itself predates this job (added in a later commit than the v0.2.0 tag, T-17/D-114) -
    # crates.io publication starts from the next tag onward, per the project owner's explicit
    # scope decision. dstu-core must land first since uacrypt's packaged manifest resolves it as a
    # registry dependency (version = "0.2.0"), not the local path - path deps are stripped from the
    # published Cargo.toml, so uacrypt's own `cargo publish` verification build would fail against
    # crates.io until dstu-core is actually there.
    name: publish to crates.io
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish -p dstu-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for crates.io index to pick up dstu-core
        run: sleep 30
      - run: cargo publish -p uacrypt
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
