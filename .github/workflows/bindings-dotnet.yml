name: bindings-dotnet

# Own job, not folded into rust.yml's matrix - bindings/dotnet has no Cargo workspace of its own at
# all (unlike Python/Node/Ruby/PHP): it consumes crates/dstu-core-capi (T-158, a real root-workspace
# member already covered by rust.yml's own --workspace build/test/clippy/fmt jobs) purely via
# P/Invoke, so there is no separate Rust dependency tree here for a supply-chain job to audit
# (docs/bindings-strategy.md T-52 step 5).

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # bindings/dotnet/DstuCore.Tests's own secretstream interop test silently *skips* (not fails)
      # when uacrypt isn't found - build both native pieces first, same reasoning as
      # bindings-python.yml/bindings-nodejs.yml's own build-uacrypt-first step.
      - run: cargo build -p dstu-core-capi --release
      - run: cargo build -p uacrypt --release
      - run: dotnet format DstuCore/DstuCore.csproj --verify-no-changes
        working-directory: bindings/dotnet
      - run: dotnet format DstuCore.Tests/DstuCore.Tests.csproj --verify-no-changes
        working-directory: bindings/dotnet
      # MemoryLeakTests' Linux-only VmRSS-delta assertion (T-213) measures process-wide memory
      # growth around its own loop, with no way to distinguish that from unrelated activity
      # elsewhere in the same process. Running it as the sole test in its own `dotnet test`
      # invocation (a fresh CLR host each time) rules that out entirely, rather than relying on
      # in-process ordering/parallelization settings to keep other tests from having run first -
      # confirmed necessary on real CI: disabling xUnit's own cross-class parallelization alone
      # only reduced the contamination (64MB "growth" against an 8MB threshold down to 12.7MB),
      # it didn't eliminate it - residual GC/thread-pool state from earlier tests in the same
      # process outlives even a full GC.Collect()+WaitForPendingFinalizers pass.
      - name: dotnet test - MemoryLeakTests in isolation (T-213, avoid cross-test VmRSS noise)
        working-directory: bindings/dotnet/DstuCore.Tests
        shell: bash
        run: dotnet test --filter "FullyQualifiedName~MemoryLeakTests" --logger "console;verbosity=detailed"
      - name: dotnet test (fail if the interop test was silently skipped)
        working-directory: bindings/dotnet/DstuCore.Tests
        shell: bash
        run: |
          dotnet test --filter "FullyQualifiedName!~MemoryLeakTests" --logger "console;verbosity=detailed" 2>&1 | tee dotnet-test-output.txt
          test "${PIPESTATUS[0]}" -eq 0
          grep -q "InteropWithUacryptCli" dotnet-test-output.txt
      # Sanity-check the pack step itself on every push (not just a release), same posture as
      # bindings-nodejs.yml's own `npm pack --dry-run` - the real fresh-install-from-a-local-feed
      # check (docs/DECISIONS.md) was done once by hand, not repeated here.
      - run: dotnet pack -c Release -o ./nupkg
        working-directory: bindings/dotnet/DstuCore
