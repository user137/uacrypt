name: rust

on:
  push:
    branches: [main, master]
  pull_request:

# A push while a previous run on the same branch is still in progress (e.g. the miri job below,
# which can run long) now cancels the stale run instead of letting it pile up alongside the new
# one - confirmed necessary 2026-07-23/24 after three concurrent miri runs (up to ~1h each) stacked
# up across a few pushes in one session (docs/TASKS.md T-85's follow-up).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build, test, fmt, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      # Default (fused-table) resource profile - docs/DECISIONS.md D-35/D-38/D-39. `--all-features`
      # below also turns on `small-tables`, which changes production behavior (not just adds an
      # unrelated flag the way `alloc` does), so it no longer stands in for "test the default
      # profile" the way it used to - these explicit no-extra-features steps cover that instead.
      - run: cargo build --workspace
      - run: cargo build --workspace --no-default-features
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings
      # small-tables resource profile (docs/DECISIONS.md D-35/D-38/D-39) - constrained-target table set.
      - run: cargo build --workspace --features dstu-core/small-tables
      - run: cargo build --workspace --no-default-features --features dstu-core/small-tables
      - run: cargo test --workspace --features dstu-core/small-tables
      - run: cargo clippy --workspace --features dstu-core/small-tables -- -D warnings
      # `getrandom` feature (docs/DECISIONS.md D-74, docs/TASKS.md T-123): makes `randombytes`/`Key::generate`
      # reachable on a bare `no_std` build without pulling in `std`/`alloc` - build-only, not
      # `cargo test`, since unrelated pre-existing `proptest`/`Vec` strategies elsewhere in
      # `hazmat::kupyna`'s test suite need `alloc` regardless of this feature (confirmed by trying
      # it, not assumed) - same reason the bare `no_std` check above is build-only too.
      - run: cargo build -p dstu-core --no-default-features --features getrandom
      - run: cargo clippy -p dstu-core --no-default-features --features getrandom -- -D warnings
      # Every feature on at once, both profiles' flags combined - catches interaction bugs neither
      # side alone would.
      - run: cargo build --workspace --all-features
      - run: cargo test --workspace --all-features
      - run: cargo clippy --workspace --all-features -- -D warnings

  miri:
    name: cargo miri test
    runs-on: ubuntu-latest
    # This job never completed on any push before docs/TASKS.md T-100 (D-59) - PROPTEST_CASES=1 alone
    # didn't bound its wall-clock time, because the bottleneck is per-case interpretation cost, not
    # case *count*: every #[test] that calls `Point::scalar_multiply` (DSTU 4145's 163-iteration
    # constant-time ladder) *or* `FieldElement::invert` (its own 162-step exponentiation, called by
    # `Point::add`/`double` too) - not just the two proptest suites originally suspected - takes
    # minutes per call under Miri's interpreter. Fixed at the source, not here: those tests now
    # carry `#[cfg_attr(miri, ignore = "...")]` (dstu4145_curve.rs, dstu4145_gf2m.rs,
    # dstu4145_signature.rs, crypto_sign.rs), so this stays the one-liner below rather than a
    # skip-list duplicating test names in two places (a CI-side skip list was considered and
    # rejected once already, T-85 - same drift risk: a new EC-heavy test added later without the
    # attribute silently reintroduces the timeout, but at least it's discoverable in the same file
    # as the test, not a remote yaml). `cargo test` (the `test` job above) still runs these tests
    # every push, unaffected - only Miri's UB-checking of the ladder/inversion is skipped, for cost
    # reasons, not correctness ones.
    # What remains after that fix is bounded but still genuinely slow (interpreted block-cipher-mode
    # tests, not EC math) - measured locally at ~84 minutes for all of `dstu-core` alone (D-59's
    # full table), a materially different situation from the open-ended runaway case the old 30-min
    # cap was set against, so raising it here is the correct response, not a repeat of that mistake.
    # 150 min = ~2.5x the measured dstu-core total, leaving margin for a slower/shared CI runner and
    # the (separately tracked, T-102) uacrypt portion this fix doesn't touch.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # `+nightly` is required despite the nightly install above: rust-toolchain.toml pins
      # `stable` repo-wide, which overrides rustup's default toolchain for any cargo invocation
      # inside this checkout.
      # MIRIFLAGS: proptest's failure-persistence lookup calls `getcwd`, which Miri's isolation
      # blocks (pre-existing, cross-platform - T-81 hit the same thing on Windows dev). PROPTEST_CASES=1
      # keeps every proptest suite in the workspace (spread across ~8 files with no shared naming
      # convention to filter on) from making this job impractically slow under interpretation,
      # while still exercising each one at least once under Miri rather than skipping them outright.
      - run: cargo +nightly miri test --workspace
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
          PROPTEST_CASES: 1

  fuzz-smoke:
    name: cargo fuzz (short smoke run, not a full campaign)
    runs-on: ubuntu-latest
    # T-98: this job used to hardcode just the `kupyna` target, leaving kalyna/kalyna_ccm/strumok
    # (which already had targets) and every Stage B-E mode-of-operation module (which didn't)
    # unfuzzed in CI - only ever run locally per D-32's note. A matrix runs every target that
    # exists (one job per entry, in parallel, each with its own pass/fail rather than one job
    # silently covering only the first target listed) rather than a sequential loop in one job -
    # this list must be kept in sync with `crates/dstu-core/fuzz/Cargo.toml`'s `[[bin]]` entries by
    # hand (no single source of truth cargo exposes for "every fuzz target name" short of parsing
    # that file), same manual-sync tradeoff `xtask fuzz`'s own target lists already accept.
    strategy:
      matrix:
        target:
          [kupyna, kalyna, kalyna_ccm, strumok, kalyna_cmac, kalyna_kw, kalyna_gcm, kalyna_gmac, kalyna_cfb, crypto_secretstream]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      # Same rust-toolchain.toml override as the miri job above - `+nightly` is not optional here.
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60
        working-directory: crates/dstu-core

  audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  msrv:
    name: MSRV build (1.87.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `dtolnay/rust-toolchain@1.87.0` installs 1.87.0 but does NOT make it active - this repo's
      # own `rust-toolchain.toml` pins `channel = "stable"` and silently overrides a bare `cargo`
      # invocation regardless (the same T-85 gotcha the miri/fuzz jobs above already work around),
      # so every step below says `cargo +1.87.0` explicitly.
      - uses: dtolnay/rust-toolchain@1.87.0
      # Build-only, both profiles (docs/DECISIONS.md D-69): the MSRV floor (`u64`/`usize::is_multiple_of`,
      # unconditional in `hazmat::kalyna_kw`/`kalyna_cbc`/`kalyna_ecb`/`kalyna_ccm`) isn't behind
      # any feature gate, so a single `--all-features` build already exercises it; the
      # `--no-default-features` counterpart is checked anyway rather than assumed, matching
      # D-39/D-41/D-62's own build-matrix precedent. Deliberately not running `clippy` (an older
      # `clippy` fires lints the pinned-`stable` job's newer one doesn't - this project has no
      # intention of satisfying two `clippy` versions forever) or the full test suite (already
      # confirmed locally that it compiles at this floor, see D-69; re-running it on every push
      # would double CI time for a floor the `stable`-pinned `test` job already exercises at a
      # newer version anyway).
      - run: cargo +1.87.0 build --workspace --all-features
      - run: cargo +1.87.0 build --workspace --no-default-features
