name: rust

on:
  push:
    branches: [main, master]
  pull_request:

# Workflow-level default: every job here only reads the repo (build/test/lint), so the least-
# privilege GITHUB_TOKEN scope is read-only contents. `audit` overrides this below since
# rustsec/audit-check needs `checks: write` to publish its check-run annotations
# (docs/DECISIONS.md D-98).
permissions:
  contents: read

# A push while a previous run on the same branch is still in progress (e.g. the miri job below,
# which can run long) now cancels the stale run instead of letting it pile up alongside the new
# one - confirmed necessary 2026-07-23/24 after three concurrent miri runs (up to ~1h each) stacked
# up across a few pushes in one session (docs/TASKS.md T-85's follow-up).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build, test, fmt, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      # Freshness lint (T-186, mandatory): README/gh-pages version markers vs crates/dstu-core's
      # Cargo.toml. Self-fetches the gh-pages branch if it isn't already resolvable (xtask's own
      # `resolve_gh_pages_ref`) - no separate checkout/fetch step needed here.
      - run: cargo xtask docs-check
      # Default (fused-table) resource profile - docs/DECISIONS.md D-35/D-38/D-39. `--all-features`
      # below also turns on `small-tables`, which changes production behavior (not just adds an
      # unrelated flag the way `alloc` does), so it no longer stands in for "test the default
      # profile" the way it used to - these explicit no-extra-features steps cover that instead.
      - run: cargo build --workspace
      - run: cargo build --workspace --no-default-features
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings
      # small-tables resource profile (docs/DECISIONS.md D-35/D-38/D-39) - constrained-target table set.
      - run: cargo build --workspace --features dstu-core/small-tables
      - run: cargo build --workspace --no-default-features --features dstu-core/small-tables
      - run: cargo test --workspace --features dstu-core/small-tables
      - run: cargo clippy --workspace --features dstu-core/small-tables -- -D warnings
      # `getrandom` feature (docs/DECISIONS.md D-74, docs/TASKS.md T-123): makes `randombytes`/`Key::generate`
      # reachable on a bare `no_std` build without pulling in `std`/`alloc` - build-only, not
      # `cargo test`, since unrelated pre-existing `proptest`/`Vec` strategies elsewhere in
      # `hazmat::kupyna`'s test suite need `alloc` regardless of this feature (confirmed by trying
      # it, not assumed) - same reason the bare `no_std` check above is build-only too.
      - run: cargo build -p dstu-core --no-default-features --features getrandom
      - run: cargo clippy -p dstu-core --no-default-features --features getrandom -- -D warnings
      # Every feature on at once, both profiles' flags combined - catches interaction bugs neither
      # side alone would.
      - run: cargo build --workspace --all-features
      - run: cargo test --workspace --all-features
      - run: cargo clippy --workspace --all-features -- -D warnings

  cross-platform-test:
    name: cross-platform core test (${{ matrix.os }})
    # The `test` job above is ubuntu-only. Its fmt/clippy steps are lint-only and OS-independent
    # for this no-OS-specific-code-path core, so repeating them here would add CI time for zero new
    # coverage - but `cargo test` runs real code (unsafe transmutes, byte-order/memory-layout
    # assumptions), which genuinely could differ by platform and had never actually been run on
    # macOS or Windows via CI before this (docs/TASKS.md T-169, added 2026-08-03) - `capi`/
    # `release`/every `bindings-*.yml` already matrix across all three OSes, this job closes the
    # same gap for `dstu-core`/`uacrypt` themselves. `ubuntu-latest` is excluded since the `test`
    # job above already covers it in full.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo xtask build
      - run: cargo xtask test

  miri:
    name: cargo miri test (${{ matrix.package }})
    runs-on: ubuntu-latest
    # Split into a per-crate matrix (T-175/D-164) - previously one `--workspace` job/log covering
    # all three crates, which is exactly why a stuck `dstu-core-capi` test (missing
    # `#[cfg_attr(miri, ignore)]`, T-175) wasn't distinguishable from the rest of the run without
    # manually picking the log apart. `fail-fast: false` so one crate's timeout/failure doesn't hide
    # the other two crates' results in the same push.
    # `dstu-core` itself moved out of this matrix into `miri-dstu-core` below (T-211/D-172) - its
    # ~41-file test suite's real wall-clock total was measured (for the first time ever, via a
    # sharded run's per-file timing) at ~9-10h, structurally unable to fit in one job even at
    # GitHub-hosted runners' 360-min hard per-job cap. `uacrypt`/`dstu-core-capi` stay here: ~17min/
    # ~12min respectively, comfortably one job each.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        package: [uacrypt, dstu-core-capi]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # `+nightly` is required despite the nightly install above: rust-toolchain.toml pins
      # `stable` repo-wide, which overrides rustup's default toolchain for any cargo invocation
      # inside this checkout.
      # MIRIFLAGS: proptest's failure-persistence lookup calls `getcwd`, which Miri's isolation
      # blocks (pre-existing, cross-platform - T-81 hit the same thing on Windows dev). PROPTEST_CASES=1
      # keeps every proptest suite in the workspace (spread across ~8 files with no shared naming
      # convention to filter on) from making this job impractically slow under interpretation,
      # while still exercising each one at least once under Miri rather than skipping them outright.
      - run: cargo +nightly miri test -p ${{ matrix.package }}
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
          PROPTEST_CASES: 1

  miri-dstu-core-discover:
    name: discover dstu-core miri test targets
    runs-on: ubuntu-latest
    # Lists `crates/dstu-core/tests/*.rs` at run time so `miri-dstu-core` below always shards by
    # whatever test files actually exist - a new test file (the next l(p) size, the next primitive)
    # gets its own isolated shard automatically, with nobody needing to remember to add a line to
    # this workflow (T-211/D-172). This job existing is itself the fix for the repeated-drift pattern
    # (T-100 -> T-156 -> T-211) where a newly added EC-heavy test file kept silently reintroducing
    # the old single-job timeout because nobody re-audited every file for `#[cfg_attr(miri,
    # ignore)]` coverage before each push.
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          targets=$(cd crates/dstu-core/tests && ls *.rs | sed 's/\.rs$//' | jq -R -s -c 'split("\n")[:-1]')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  miri-dstu-core:
    name: cargo miri test (dstu-core, ${{ matrix.target }})
    needs: miri-dstu-core-discover
    runs-on: ubuntu-latest
    # One job per integration-test file (T-211/D-172) instead of one job for the whole crate -
    # `fail-fast: false` so this run is also the first-ever real per-file timing data for this
    # suite (the job never completed before, so no prior run could produce it). 360 min (GitHub-
    # hosted runners' hard per-job cap) kept unchanged here for this landing rather than guessing a
    # tighter number per shard - tighten once a full sharded run's real per-file times exist to set
    # each shard's cap to ~2x its measured max, the same margin discipline D-103 already established
    # for the old single-job cap.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.miri-dstu-core-discover.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo +nightly miri test -p dstu-core --test ${{ matrix.target }}
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
          PROPTEST_CASES: 1

  miri-dstu-core-lib:
    name: cargo miri test (dstu-core, lib)
    runs-on: ubuntu-latest
    # dstu-core's own unit tests (src/lib.rs and submodules) - not an integration-test file, so
    # `miri-dstu-core-discover` above can't see it; measured at ~8.4min in the run that surfaced
    # this whole split (T-211/D-172), kept at the same 360-min cap as its siblings for now.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - run: cargo +nightly miri test -p dstu-core --lib
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
          PROPTEST_CASES: 1

  kani:
    name: cargo kani (gf2m163::reduce + dstu9041::fp256 proofs, D-102/T-177)
    runs-on: ubuntu-latest
    # Pilot measured ~1.5 min total for both harnesses (docs/DECISIONS.md D-102) - generous margin
    # over that, not a sign this is expected to run long.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cargo install kani-verifier
      - run: cargo kani setup
      # No --harness filter: `#[kani::proof]` fns are auto-discovered, unlike cargo-fuzz's targets
      # (which need the separate FUZZ_TARGETS/matrix list below) - a future harness added anywhere
      # in dstu-core is picked up here without an extra sync point.
      - run: cargo kani -p dstu-core

  fuzz-smoke:
    name: cargo fuzz (short smoke run, not a full campaign)
    runs-on: ubuntu-latest
    # T-98: this job used to hardcode just the `kupyna` target, leaving kalyna/kalyna_ccm/strumok
    # (which already had targets) and every Stage B-E mode-of-operation module (which didn't)
    # unfuzzed in CI - only ever run locally per D-32's note. A matrix runs every target that
    # exists (one job per entry, in parallel, each with its own pass/fail rather than one job
    # silently covering only the first target listed) rather than a sequential loop in one job -
    # this list must be kept in sync with `crates/dstu-core/fuzz/Cargo.toml`'s `[[bin]]` entries by
    # hand (no single source of truth cargo exposes for "every fuzz target name" short of parsing
    # that file), same manual-sync tradeoff `xtask fuzz`'s own target lists already accept.
    strategy:
      matrix:
        target:
          [kupyna, kalyna, kalyna_ccm, strumok, kalyna_cmac, kalyna_kw, kalyna_gcm, kalyna_gmac, kalyna_cfb, crypto_secretstream]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      # Same rust-toolchain.toml override as the miri job above - `+nightly` is not optional here.
      - run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=60
        working-directory: crates/dstu-core

  audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    # Overrides the workflow-level `contents: read` default: rustsec/audit-check's own README
    # documents `checks: write` as needed to publish its check-run annotation (docs/DECISIONS.md
    # D-98) - without it the job would still run but silently lose that annotation.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  qemu-stm32:
    name: QEMU STM32 smoke test (firmware/qemu-stm32-smoketest, T-170/D-156)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-arm qemu-system-misc
      - run: cargo xtask qemu-stm32

  streaming-bounded:
    name: uacrypt streaming-boundedness proof (${{ matrix.os }}, D-42/T-200)
    # Matrixed across all three OSes on purpose, not just the dev machine this was written on
    # (Windows): the memory-sampling harness (`crates/uacrypt/tests/support/mod.rs`) has a
    # genuinely different implementation per platform (`/proc/<pid>/status` on Linux, a
    # `Get-Process`-polling PowerShell watcher on Windows, a `ps -o rss=`-polling shell watcher on
    # macOS) - only the Windows path was empirically verified locally before this job existed, so
    # this is the first real confirmation the Linux/macOS paths work at all, not just that they
    # compile.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo xtask streaming-bounded

  capi:
    name: capi (cbindgen header, C test harness, examples)
    # `dstu-core-capi` IS a real root-workspace member (D-119/D-148) - the `test` job above
    # already covers its Rust-side build/test/clippy/fmt for free via `--workspace`. This job only
    # covers what needs a real C compiler: the cbindgen header-drift check, plus compiling and
    # running the plain-C test harness (`c-tests/`) and every example (`examples/`) against the
    # just-built cdylib - `cargo xtask capi` does all of this in one command (xtask/src/main.rs).
    #
    # Windows note: `dtolnay/rust-toolchain@stable` on `windows-latest` installs the MSVC-hosted
    # toolchain by default, so `cl.exe`/`link.exe` are needed, not on PATH by default. Deliberately
    # NOT using `ilammy/msvc-dev-cmd` here - `xtask`'s own `capi_compile_msvc` already finds
    # `vcvars64.bat` via `vswhere.exe` (present on GitHub-hosted Windows runners) and sources it
    # internally per invocation (the same pattern `fuzz_windows_msvc` already uses for cargo-fuzz),
    # so a separate environment-setup action would just duplicate what `cargo xtask capi` already
    # does itself - confirmed by this same logic passing locally on this dev machine's own
    # GNU-hosted toolchain (`target_env = "gnu"` branch, `gcc`), which `xtask` distinguishes from
    # MSVC via its own compiled-in `cfg!(target_env = ...)`, not by asking the OS.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cbindgen --locked
      - run: cargo xtask capi

  capi-double-free-asan:
    name: capi double-free contract (ASan regression backstop, CI-only)
    # T-216 part 2: every dstu_*_free doc comment now explicitly names double-free as UB the
    # function cannot detect (T-216 part 1). This job doesn't make double-free supported - it
    # makes sure a future refactor that exposes it from safe-looking code gets caught rather than
    # silently passing. Deliberately its own binary/job, not merged into `test_capi.c`'s
    # CHECK()/failures-counter harness above: under ASan a double-free aborts the process, which
    # doesn't fit that shape and would break the `capi` job on all three OSes if combined into the
    # same main(). Linux-only (ASan needs libasan; this project's own Windows dev machine has none
    # for its MinGW toolchain, confirmed 2026-08-31 - not locally verifiable there, CI is the first
    # real confirmation).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p dstu-core-capi --release
      - name: build the ASan double-free harness
        run: |
          gcc -std=c11 -Wall -fsanitize=address -g \
            -I crates/dstu-core-capi/include \
            crates/dstu-core-capi/c-tests/test_capi_double_free_asan.c \
            -o /tmp/capi_double_free_asan \
            -L target/release -ldstu_core_capi -Wl,-rpath,target/release
      - name: run it - expect ASan to abort on the deliberate double-free (nonzero exit)
        run: |
          set +e
          /tmp/capi_double_free_asan > /tmp/out.log 2>&1
          code=$?
          cat /tmp/out.log
          set -e
          if [ "$code" -eq 0 ]; then
            echo "FAIL: process exited 0 - ASan did not catch the double-free"
            exit 1
          fi
          # The second dstu_auth_key_free's Box::from_raw re-drops the (already-dropped) Key,
          # whose Drop impl writes zeroize() bytes into now-freed memory - ASan reports THAT as a
          # heap-use-after-free before the call ever reaches the allocator's free(), so it never
          # emits a "double-free" diagnostic specifically. Any ASan error on this deliberate misuse
          # is the real success condition, not one particular diagnostic string.
          grep -qiE "AddressSanitizer: (heap-use-after-free|double-free|attempting free)" /tmp/out.log \
            || { echo "FAIL: nonzero exit but no ASan error found in output"; exit 1; }
          echo "OK: ASan caught the deliberate double-free (as a use-after-free during zeroize-on-drop, or a double-free directly) as expected"

  msrv:
    name: MSRV build (1.87.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `dtolnay/rust-toolchain@1.87.0` installs 1.87.0 but does NOT make it active - this repo's
      # own `rust-toolchain.toml` pins `channel = "stable"` and silently overrides a bare `cargo`
      # invocation regardless (the same T-85 gotcha the miri/fuzz jobs above already work around),
      # so every step below says `cargo +1.87.0` explicitly.
      - uses: dtolnay/rust-toolchain@1.87.0
      # Build-only, both profiles (docs/DECISIONS.md D-69): the MSRV floor (`u64`/`usize::is_multiple_of`,
      # unconditional in `hazmat::kalyna_kw`/`kalyna_cbc`/`kalyna_ecb`/`kalyna_ccm`) isn't behind
      # any feature gate, so a single `--all-features` build already exercises it; the
      # `--no-default-features` counterpart is checked anyway rather than assumed, matching
      # D-39/D-41/D-62's own build-matrix precedent. Deliberately not running `clippy` (an older
      # `clippy` fires lints the pinned-`stable` job's newer one doesn't - this project has no
      # intention of satisfying two `clippy` versions forever) or the full test suite (already
      # confirmed locally that it compiles at this floor, see D-69; re-running it on every push
      # would double CI time for a floor the `stable`-pinned `test` job already exercises at a
      # newer version anyway).
      - run: cargo +1.87.0 build --workspace --all-features
      - run: cargo +1.87.0 build --workspace --no-default-features
