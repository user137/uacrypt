name: bindings-ruby

# Own job, not folded into rust.yml's matrix (D-119) - bindings/ruby is a separate Cargo workspace
# neither of rust.yml's `--workspace` jobs (Miri, the MSRV build) is equipped for, and release.yml
# only fires on `v*` tags, which would leave this binding with zero regression coverage between
# releases (docs/bindings-strategy.md T-160 step 5, mirrors bindings-python.yml/bindings-nodejs.yml).
#
# Windows needs one extra step no other binding does: `magnus`/`rb_sys` use `bindgen`, and this
# repo's own dev machine found (D-133) that a generic, already-installed Windows LLVM parses
# Ruby's mingw-targeted headers incorrectly - the fix is a matching MSYS2 ucrt64 `clang` package
# plus `LIBCLANG_PATH` pointed at it, not anything Linux/macOS runners need.

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Windows needs the GNU-host toolchain specifically, not `windows-latest`'s own MSVC
      # default (the reverse of Node's own D-125/D-130 finding: Node needed to force MSVC on a
      # GNU-default *local* machine, here CI's MSVC-default host needs forcing to GNU instead) -
      # rb_sys's generated Makefile passes GNU/mingw-style linker flags (`-C linker=gcc`) to
      # whichever Rust toolchain is active, and an MSVC-host toolchain emits MSVC-style `/FLAG`
      # linker arguments that `gcc`/`ld.exe` can't parse at all - confirmed by a real CI failure
      # (`ld.exe: cannot find /NOLOGO: No such file or directory`), not assumed.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.os == 'windows-latest' && 'stable-x86_64-pc-windows-gnu' || 'stable' }}
          components: clippy, rustfmt
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: bindings/ruby
      # See this file's own header comment and D-133 - matches the exact fix this repo's own
      # Windows dev machine needed for `rb-sys`'s bindgen step. `ridk` itself isn't on PATH on
      # this hosted runner (confirmed by a real CI failure, not assumed) - but `ruby/setup-ruby`'s
      # `shell: bash` steps already run inside the bundled MSYS2's own bash (its `usr/bin` is
      # already on that shell's PATH), so `pacman`/`cygpath` work directly with no `ridk exec`
      # wrapper needed.
      - name: Install a matching MSYS2 clang for bindgen (Windows only, D-133)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: pacman -S --needed --noconfirm mingw-w64-ucrt-x86_64-clang
      - name: Point LIBCLANG_PATH at it (Windows only, D-133)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: echo "LIBCLANG_PATH=$(cygpath -w /ucrt64/bin)" >> "$GITHUB_ENV"
      # ubuntu-only, matching rust.yml's own fmt job and bindings-python.yml/bindings-nodejs.yml:
      # actions/checkout on a Windows/macOS runner applies git's autocrlf translation, which makes
      # every LF-checked-in file look like "Incorrect newline style" to `cargo fmt --check` - a
      # known false positive (docs/DECISIONS.md D-108's notes), not specific to this workflow.
      - run: cargo fmt --all -- --check
        if: matrix.os == 'ubuntu-latest'
        working-directory: bindings/ruby
      # `RUSTUP_TOOLCHAIN` (Windows only) - this repo's own root `rust-toolchain.toml` pins a bare
      # `channel = "stable"` with no host triple, which resolves against the machine's *default
      # host* (MSVC on this runner) and silently overrides the `rustup default` the toolchain step
      # above just set, for any cargo invocation anywhere under this repo's tree - the exact
      # toolchain-file-override gotcha `CLAUDE.md` already documents for nightly (miri/fuzz),
      # confirmed here to apply to host-triple selection too, not just channel, via a real second
      # CI failure showing the *same* MSVC linker error even after the round-2 fix. `RUSTUP_TOOLCHAIN`
      # overrides a toolchain file outright, unlike `rustup default`.
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: bindings/ruby
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.os == 'windows-latest' && 'stable-x86_64-pc-windows-gnu' || '' }}
      # From the repo root: the RSpec interop test needs the real uacrypt binary to exercise the
      # wire-format check that justifies this binding existing, same reasoning as
      # bindings-python.yml/bindings-nodejs.yml's own uacrypt build step.
      - run: cargo build -p uacrypt --release
      - run: bundle exec rake compile
        working-directory: bindings/ruby
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.os == 'windows-latest' && 'stable-x86_64-pc-windows-gnu' || '' }}
      - run: bundle exec rubocop
        working-directory: bindings/ruby
      - run: bundle exec rspec
        working-directory: bindings/ruby
      # Sanity-check packaging on every OS, every push (not just a release build) - a broken
      # `files` glob (D-136's real gotcha, found on this exact binding) would otherwise only be
      # caught at release time.
      - run: gem build dstu_core.gemspec
        working-directory: bindings/ruby

  supply-chain:
    name: cargo deny / audit (bindings/ruby)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/ruby
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-deny --locked
      # Root deny.toml, found by cargo-deny walking up from this cwd (see deny.toml's own header
      # comment) - checks this workspace's real dependency tree (magnus/rb-sys and friends), not a
      # copy.
      - run: cargo deny check
      - run: cargo install cargo-audit --locked
      - run: cargo audit
